{% extends "base.html" %}

{% block title %}Add Product - BuyMo{% endblock %}

{% block extra_css %}
<style>
    .product-form-container {
        max-width: 800px;
        margin: 24px auto;
        padding: 0 16px;
    }
    .product-form {
        background: #fff;
        border-radius: 19px;
        border: 1px solid #e5e7eb;
        padding: 32px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-header {
        text-align: center;
        margin-bottom: 32px;
    }
    .form-header h2 {
        color: #1f2937;
        font-weight: 700;
        font-size: 1.75rem;
        margin-bottom: 8px;
    }
    .form-header p {
        color: #6b7280;
        font-size: 0.95rem;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-label {
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
        color: #374151;
    }
    .required-field::after {
        content: " *";
        color: #ef4444;
    }
    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }
    .btn-submit {
        background: var(--opus-green);
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .btn-submit:hover {
        background: var(--opus-green-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(7, 104, 80, 0.2);
    }
    .image-preview {
        width: 100%;
        max-width: 300px;
        height: 200px;
        border: 2px dashed #d1d5db;
        border-radius: 12px;
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f9fafb;
    }
    .image-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    .image-preview span {
        color: #9ca3af;
        font-size: 0.9rem;
    }
    @media (max-width: 768px) {
        .product-form {
            padding: 24px 20px;
        }
        .form-header h2 {
            font-size: 1.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="product-form-container">
    <div class="product-form">
        <div class="form-header">
            <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
            <p>Fill in the details below to add a new product</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name" class="form-label required-field">Product Name</label>
                <input type="text" id="name" name="name" class="form-control" required 
                       placeholder="Enter product name (e.g. Wireless Headphones)">
            </div>

            <div class="form-group">
                <label for="price" class="form-label required-field">Price</label>
                <div class="input-group">
                    <span class="input-group-text">R</span>
                    <input type="number" id="price" name="price" class="form-control" 
                           step="0.01" min="0.01" required placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control" 
                          placeholder="Describe the product features and specifications..."></textarea>
            </div>

            <div class="form-group">
                <label for="category" class="form-label required-field">Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">-- Select Category --</option>
                    {% for category in categories %}
                        <option value="{{ category[0] }}">{{ category[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="quantity" class="form-label required-field">Initial Stock</label>
                <input type="number" id="quantity" name="quantity" class="form-control"
                       min="1" value="10" required 
                       {% if not current_user.is_admin %}disabled{% endif %}>
            </div>

            <div class="form-group">
                <label for="image" class="form-label required-field">Product Image</label>
                <input type="file" id="image" name="image" class="form-control" 
                       accept=".png,.jpg,.jpeg,.gif" required>
                <div class="image-preview" id="imagePreview">
                    <span><i class="fas fa-image"></i> Image Preview</span>
                </div>
            </div>

            <div class="form-group mt-4">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Add Product
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Image preview functionality
const imageInput = document.getElementById('image');
const imagePreview = document.getElementById('imagePreview');

imageInput.addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
        }
        reader.readAsDataURL(file);
    } else {
        imagePreview.innerHTML = '<span><i class="fas fa-image"></i> Image Preview</span>';
    }
});
</script>
{% endblock %}
