{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm border-0" style="border-radius: 19px; overflow: hidden;">
        <div class="bg-primary p-4 text-center text-white"
          style="background: linear-gradient(135deg, var(--opus-green) 0%, #065c46 100%) !important;">
          <h3 class="fw-bold mb-0">Reset Password</h3>
          <p class="mb-0 opacity-75">Enter your email to receive a link</p>
        </div>
        <div class="card-body p-4">
          <form method="POST">
            <div class="mb-3">
              <label for="email" class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-0" id="email" name="email" required
                  placeholder="name@example.com" style="padding: 12px;">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-3 mt-2" style="border-radius: 12px;">
              Send Reset Link
            </button>
          </form>
          <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
              <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
