<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BuyMo</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign.css') }}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="opus-form w-full max-w-md p-8">
        <!-- OPUS HEADER -->
        <div class="opus-header">
            <h1>BuyMo</h1>
            <h2>Shop Smarter, Live Better</h2>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <!-- Centered Signup Title -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Sign Up</h1>
            <p class="text-gray-600 mt-2">Join us today! Create your account</p>
        </div>
        
        <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">User Name</label>
                <input type="text" id="username" name="username" required 
                       class="opus-input w-full px-3 py-2 focus:outline-none">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required 
                       class="opus-input w-full px-3 py-2 focus:outline-none">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required 
                       class="opus-input w-full px-3 py-2 focus:outline-none">
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required 
                       class="opus-input w-full px-3 py-2 focus:outline-none">
            </div>
            <button type="submit" class="opus-btn w-full py-3 px-4 mt-4 text-lg">
                Sign Up →
            </button>
        </form>
        
        <div class="text-center my-6">
            <span class="text-gray-500 text-sm">OR</span>
        </div>
        
        <div class="text-center">
            <p class="text-gray-600 text-sm">
                Already have an account? <a href="{{ url_for('login') }}" class="text-custom-green hover:underline font-medium">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
