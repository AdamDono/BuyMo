{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0" style="border-radius: 19px; overflow: hidden;">
                <div class="bg-primary p-4 text-center text-white"
                    style="background: linear-gradient(135deg, var(--opus-green) 0%, #065c46 100%) !important;">
                    <h3 class="fw-bold mb-0">New Password</h3>
                    <p class="mb-0 opacity-75">Create a secure new password</p>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold text-muted text-uppercase">New
                                Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i
                                        class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-0" id="password"
                                    name="password" required placeholder="••••••••" minlength="6"
                                    style="padding: 12px;">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password"
                                class="form-label small fw-bold text-muted text-uppercase">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i
                                        class="fas fa-check-double text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-0" id="confirm_password"
                                    name="confirm_password" required placeholder="••••••••" style="padding: 12px;">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 mt-2"
                            style="border-radius: 12px;">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
