<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BuyMo{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block navbar %}
    {% include 'header.html' %}
    {% endblock %}

    <main class="main-content" style="padding: 40px 0;">
        {% block content %}{% endblock %}
    </main>


    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Global Toast Notification -->
    <div id="global-toast" class="toast-notification" role="alert" aria-live="polite">
        <i class="fas fa-check-circle"></i>
        <span id="global-toast-message"></span>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Global toast function
        window.showToast = function (message, type = 'success') {
            const toast = document.getElementById('global-toast');
            const toastMessage = document.getElementById('global-toast-message');
            const icon = toast.querySelector('i');

            toastMessage.textContent = message;

            // Update icon based on type
            if (type === 'error' || type === 'danger') {
                icon.className = 'fas fa-exclamation-circle';
                toast.className = 'toast-notification show error';
            } else if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle';
                toast.className = 'toast-notification show warning';
            } else {
                icon.className = 'fas fa-check-circle';
                toast.className = 'toast-notification show success';
            }

            setTimeout(() => {
                toast.className = 'toast-notification';
            }, 3500);
        }

        // Show flash messages as toasts
        document.addEventListener('DOMContentLoaded', function () {
            {% with messages = get_flashed_messages(with_categories = true) %}
            {% if messages %}
            {% for category, message in messages %}
            showToast('{{ message }}', '{{ category }}');
            {% endfor %}
            {% endif %}
            {% endwith %}

            // Loading indicator logic
            const loader = document.getElementById('loading-overlay');

            // Show loader on link clicks (except specific ones)
            document.addEventListener('click', function (e) {
                const link = e.target.closest('a');
                if (link && !link.target && !link.hasAttribute('download') &&
                    !link.href.startsWith('javascript') && !link.href.includes('#')) {
                    // Don't show for same page anchor links
                    if (link.href !== window.location.href) {
                        loader.classList.add('show');
                    }
                }
            });

            // Show loader on form submit
            document.addEventListener('submit', function (e) {
                const form = e.target;
                if (!form.hasAttribute('target')) {
                    loader.classList.add('show');
                }
            });

            // Hide loader when page is fully loaded (back button support)
            window.addEventListener('pageshow', function (event) {
                if (event.persisted) {
                    loader.classList.remove('show');
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
