<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BuyMo{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block navbar %}
    {% include 'header.html' %}
    {% endblock %}

    <main class="main-content" style="padding: 40px 0;">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align: center; padding: 15px 0; color: #888; margin-top: auto; font-size: 0.85rem;">
        <p style="margin: 0; font-weight: 500; letter-spacing: 0.5px;">BuyMo@2026</p>
    </footer>


    <!-- Global Toast Notification -->
    <div id="global-toast" class="toast-notification" role="alert" aria-live="polite">
        <i class="fas fa-check-circle"></i>
        <span id="global-toast-message"></span>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}?v=1.2"></script>
    <script>
        // Global toast function
        window.showToast = function (message, type = 'success') {
            const toast = document.getElementById('global-toast');
            const toastMessage = document.getElementById('global-toast-message');
            const icon = toast.querySelector('i');

            toastMessage.textContent = message;

            // Update icon based on type
            if (type === 'error' || type === 'danger') {
                icon.className = 'fas fa-exclamation-circle';
                toast.className = 'toast-notification show error';
            } else if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle';
                toast.className = 'toast-notification show warning';
            } else {
                icon.className = 'fas fa-check-circle';
                toast.className = 'toast-notification show success';
            }

            setTimeout(() => {
                toast.className = 'toast-notification';
            }, 3500);
        }

        // Show flash messages as toasts
        document.addEventListener('DOMContentLoaded', function () {
            {% with messages = get_flashed_messages(with_categories = true) %}
            {% if messages %}
            {% for category, message in messages %}
            showToast('{{ message }}', '{{ category }}');
            {% endfor %}
            {% endif %}
            {% endwith %}
        });

        // Global Wishlist Toggle Function
        window.toggleWishlist = async function (btn, productId) {
            // Check if user is logged in (simple check if button exists)
            if (!productId) return;

            try {
                // Determine animation state
                const icon = btn.querySelector('i');
                // Optimistic UI update
                if (icon.classList.contains('far')) {
                    icon.classList.replace('far', 'fas');
                    icon.style.transform = 'scale(1.2)';
                } else {
                    icon.classList.replace('fas', 'far');
                }
                setTimeout(() => icon.style.transform = 'scale(1)', 200);

                const response = await fetch(`/wishlist/toggle/${productId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                if (data.status === 'success') {
                    showToast(data.message, 'success');
                    // Correct UI if optimistic update was wrong
                    if (data.added) {
                        icon.classList.remove('far');
                        icon.classList.add('fas');
                    } else {
                        icon.classList.remove('fas');
                        icon.classList.add('far');
                    }
                } else {
                    // Revert on server error
                    showToast(data.message || 'Error updating wishlist', 'error');
                    if (icon.classList.contains('fas')) {
                        icon.classList.replace('fas', 'far');
                    } else {
                        icon.classList.replace('far', 'fas');
                    }
                }
            } catch (error) {
                console.error('Wishlist error:', error);
                showToast('Something went wrong', 'error');
                // Revert on implementation error
                if (icon.classList.contains('fas')) {
                    icon.classList.replace('fas', 'far');
                } else {
                    icon.classList.replace('far', 'fas');
                }
            }
        }    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
