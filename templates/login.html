{% extends "base.html" %}

{% block title %}Log In - BuyMo{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="opus-form w-100" style="max-width: 480px; padding: 2rem;">
    <div class="opus-header">
      <h1>BuyMo</h1>
      <h2>Shop Smarter, Live Better</h2>
    </div>

    <div class="text-center mb-4">
      <h1 class="h3 fw-bold text-dark">Login</h1>
      <p class="text-muted mt-2">Welcome back! Please sign in to your account</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" required class="form-control opus-input">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" required class="form-control opus-input">
      </div>
      <button type="submit" class="opus-btn w-100 py-3 mt-2">Sign In →</button>
    </form>

    <div class="text-center my-4">
      <span class="text-muted small">OR</span>
    </div>

    <div class="text-center">
      <p class="text-muted small">
        Don't have an account? <a href="{{ url_for('signup') }}" class="text-custom-green fw-semibold">Sign up</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
